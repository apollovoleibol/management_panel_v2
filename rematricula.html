<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1332">
<meta name="robots" content="noindex">
<meta name="description" content="Rematrícula 2027 do Grupo Apollo de Voleibol: revise o cadastro, escolha a turma, aceite o contrato e pague a taxa por Pix.">
<title>Rematrícula 2027 · Apollo Voleibol</title>
<link rel="icon" type="image/svg+xml" href="assets/apollo-huddle.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rematricula.css?v=3">
</head>
<body>
<header class="top">
  <div class="top-in">
    <img src="assets/apollo-logo.svg" alt="Apollo Voleibol">
    <div class="top-title"><b>Rematrícula 2027</b><small>Grupo Apollo de Voleibol</small></div>
    <button class="top-exit" id="exitBtn" type="button" hidden>Sair</button>
  </div>
  <div class="progress" id="progress" hidden>
    <div class="progress-row"><b id="progressTitle"></b><span id="progressCount"></span></div>
    <div class="bar" role="progressbar" aria-label="Progresso da rematrícula" aria-valuemin="0" aria-valuemax="100" id="progressBar"><i></i></div>
  </div>
</header>

<main id="app" tabindex="-1" aria-live="polite">
  <noscript><div class="alert">Ative o JavaScript do navegador para fazer a rematrícula.</div></noscript>
</main>

<div class="actions" id="actions" hidden><div class="actions-in" id="actionsIn"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="js/contrato-2027.js?v=1"></script>
<script src="js/rematricula.js?v=4"></script>
</body>
</html>
