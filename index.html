<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apollo · Painel de Gestão v2</title>
<link rel="icon" href="assets/favicon-32.png">
<link rel="stylesheet" href="styles.css?v=21">
<link rel="stylesheet" href="skeleton.css?v=2.5">
<link rel="stylesheet" href="huddle-ui.css?v=2.9.1">
<link rel="stylesheet" href="huddle-v29.css?v=2.9.1">
<style>body:not(.app-ready) .sidebar,body:not(.app-ready) .main{display:none}body.app-ready #startup,label.viewas[hidden]{display:none}</style>
</head>
<body>
<div id="startup" role="status" aria-busy="true">
  <span class="sr">Carregando dados da Apollo...</span>
  <div class="sk-panel-side" aria-hidden="true">
    <div class="sk-panel-brand"><img src="assets/apollo-logo.svg" alt=""><span class="sk-line sk-dark" style="width:58%;height:9px"></span></div>
    <div class="sk-panel-nav"><span class="sk-line sk-dark" style="width:35%"></span><span class="sk-line sk-dark"></span><span class="sk-line sk-dark" style="width:84%"></span><span class="sk-line sk-dark" style="width:90%"></span><span class="sk-line sk-dark" style="width:42%;margin-top:20px"></span><span class="sk-line sk-dark" style="width:86%"></span><span class="sk-line sk-dark" style="width:74%"></span></div>
    <div class="sk-panel-user"><span class="sk-circle sk-dark"></span><span class="sk-line sk-dark" style="width:58%"></span></div>
  </div>
  <div class="sk-panel-main" aria-hidden="true">
    <div class="sk-panel-top"><span class="sk-line" style="width:140px"></span><span class="sk-circle"></span></div>
    <div class="sk-panel-content">
      <div class="sk-heading"><span class="sk-line" style="width:120px;height:10px"></span><span class="sk-line" style="width:250px;height:28px"></span><span class="sk-line" style="width:min(480px,80%);height:12px"></span></div>
      <div class="sk-metrics"><div class="sk-card"><span class="sk-line" style="width:56%"></span><span class="sk-line" style="width:40%;height:30px"></span><span class="sk-line" style="width:74%"></span></div><div class="sk-card"><span class="sk-line" style="width:62%"></span><span class="sk-line" style="width:34%;height:30px"></span><span class="sk-line" style="width:70%"></span></div><div class="sk-card"><span class="sk-line" style="width:50%"></span><span class="sk-line" style="width:46%;height:30px"></span><span class="sk-line" style="width:67%"></span></div></div>
      <div class="sk-panels"><div class="sk-card sk-large"><span class="sk-line" style="width:38%;height:18px"></span><span class="sk-line" style="width:88%"></span><span class="sk-block"></span></div><div class="sk-card sk-large"><span class="sk-line" style="width:56%;height:18px"></span><span class="sk-line" style="width:78%"></span><span class="sk-block"></span></div></div>
    </div>
  </div>
</div>
<aside class="sidebar" id="sidebar" aria-label="Navegação principal">
  <div class="brand">
    <img src="assets/apollo-logo.svg" alt="Apollo">
    <small>PAINEL DE GESTÃO</small>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="side-user" id="sideUser"></div>
</aside>

<div class="main">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="crumbs">Gestão <span aria-hidden="true">/</span> <b id="crumb">Visão geral</b></div>
    <div class="top-right">
      <label class="viewas" hidden><span>Visualizar como:</span><select id="viewAs" aria-label="Visualizar como perfil"></select></label>
      <button class="btn sm guide-trigger" id="guideBtn" type="button" aria-label="Abrir orientação desta página">Ajuda</button>
      <button class="icon-btn" id="themeBtn" aria-label="Alternar tema claro/escuro">
        <svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>
  <main class="content" id="content" tabindex="-1"></main>
</div>

<aside id="guidePanel" class="guide-panel" role="dialog" aria-label="Orientação da página" hidden></aside>

<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<dialog id="dlg2" class="sm" aria-labelledby="dlg2Title"></dialog>
<div id="toast" class="toast hide" role="status" aria-live="polite"></div>

<script src="js/core.js?v=2.9.1"></script>
<script src="js/pages-ops.js?v=2.9.1"></script>
<script src="js/pages-overview-roles.js?v=2.9.1"></script>
<script src="js/pages-config.js?v=2.9.1"></script>
<script src="js/pages-admin.js?v=2.9.1"></script>
<script src="vendor/jszip.min.js"></script>
<script src="js/finance-reports.js?v=2.9.1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/finance-db.js?v=2.9.1"></script>
<script src="js/auth.js?v=21"></script>
<script src="js/service-metrics.js?v=2.9.1"></script>
<script src="js/live-data.js?v=2.9.1"></script>
<script src="js/finance-page.js?v=2.9.1"></script>
<script src="js/onboarding.js?v=2.6.1"></script>
<script src="js/main.js?v=2.9.1"></script>
</body>
</html>
