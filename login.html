<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huddle · Apollo</title>
<link rel="icon" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=21">
<link rel="stylesheet" href="atleta.css?v=2.4">
<style>#logoutBtn[hidden]{display:none}</style>
</head>
<body>
<div class="login">
  <section class="login-brand">
    <canvas class="login-stars" aria-hidden="true"></canvas>
    <img class="login-apollo" src="assets/apollo-logo.svg" alt="Apollo">
    <div class="login-lockup">
      <h1 class="login-huddle">Huddle</h1>
      <span class="login-divider" aria-hidden="true"></span>
      <p class="login-description">Sistema Integrado <span>de Gestão</span></p>
    </div>
    <small class="login-version" id="loginVersion"></small>
  </section>
  <section class="login-side">
    <div class="login-card" id="card">
      <button class="btn gbtn" id="googleBtn" type="button">
        <img class="google-icon" src="assets/google-g.png" alt="" aria-hidden="true" width="20" height="20">
        <span class="google-label">Entrar com Google</span>
        <span class="google-spinner" aria-hidden="true"></span>
      </button>
      <button class="btn ghost sm" type="button" id="logoutBtn" hidden>Usar outra conta Google</button>
      <p id="loginMessage" role="status" aria-live="polite"></p>
    </div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/finance-db.js?v=21"></script>
<script src="js/auth.js?v=21"></script>
<script src="js/version.js?v=2.9.3"></script>
<script src="js/login-stars.js?v=2.4"></script>
<script src="js/login.js?v=2.5"></script>
</body>
</html>
